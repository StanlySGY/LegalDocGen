services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legaldocgen}
      POSTGRES_USER: ${POSTGRES_USER:-legaldocgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: local
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_TOKEN_EXPIRE_HOURS: ${AUTH_TOKEN_EXPIRE_HOURS:-24}
      ALLOW_USER_REGISTRATION: ${ALLOW_USER_REGISTRATION:-false}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env.production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env.production}
      API_KEY_SECRET: ${API_KEY_SECRET:?set API_KEY_SECRET in .env.production}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.production}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openai}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-mimo-v2.5-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-mimo-v2.5-pro}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      CUSTOM_MODEL_NAME: ${CUSTOM_MODEL_NAME:-}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_PRODUCT_MODE: ${VITE_PRODUCT_MODE:-personal_lawyer}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  uploads:
