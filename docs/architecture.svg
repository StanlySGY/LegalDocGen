<svg width="1120" height="680" viewBox="0 0 1120 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="90" y1="70" x2="1030" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
      .layer-title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2937; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; filter: url(#shadow); }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .arrow { stroke: #6366f1; stroke-width: 2.5; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="1120" height="680" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" class="title">LegalDocGen 系统架构</text>
  <text x="70" y="86" class="subtitle">React 前端、FastAPI 后端、工作流引擎、材料解析、模型调度与导出服务组成的法律文书生成平台</text>

  <rect x="70" y="120" width="980" height="120" rx="22" class="box"/>
  <text x="100" y="155" class="layer-title">前端应用层 · React 18 + TypeScript + Vite</text>
  <rect x="100" y="175" width="145" height="42" rx="12" class="pill"/><text x="128" y="201" class="label">案件工作台</text>
  <rect x="265" y="175" width="145" height="42" rx="12" class="pill"/><text x="293" y="201" class="label">材料管理</text>
  <rect x="430" y="175" width="145" height="42" rx="12" class="pill"/><text x="458" y="201" class="label">工作流页面</text>
  <rect x="595" y="175" width="145" height="42" rx="12" class="pill"/><text x="623" y="201" class="label">模型渠道</text>
  <rect x="760" y="175" width="145" height="42" rx="12" class="pill"/><text x="788" y="201" class="label">模板配置</text>

  <line x1="560" y1="250" x2="560" y2="292" class="arrow"/>
  <text x="584" y="276" class="small">REST API / SSE Stream</text>

  <rect x="70" y="300" width="980" height="170" rx="22" class="box"/>
  <text x="100" y="335" class="layer-title">后端服务层 · FastAPI + SQLAlchemy</text>
  <rect x="100" y="358" width="150" height="42" rx="12" class="pill"/><text x="128" y="384" class="label">案件路由</text>
  <rect x="270" y="358" width="150" height="42" rx="12" class="pill"/><text x="298" y="384" class="label">材料路由</text>
  <rect x="440" y="358" width="150" height="42" rx="12" class="pill"/><text x="468" y="384" class="label">工作流路由</text>
  <rect x="610" y="358" width="150" height="42" rx="12" class="pill"/><text x="638" y="384" class="label">模板路由</text>
  <rect x="780" y="358" width="150" height="42" rx="12" class="pill"/><text x="808" y="384" class="label">渠道路由</text>

  <rect x="140" y="418" width="150" height="34" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/><text x="166" y="440" class="small">文件解析服务</text>
  <rect x="310" y="418" width="150" height="34" rx="10" fill="#ECFEFF" stroke="#A5F3FC"/><text x="336" y="440" class="small">工作流引擎</text>
  <rect x="480" y="418" width="150" height="34" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/><text x="506" y="440" class="small">Prompt 管理</text>
  <rect x="650" y="418" width="150" height="34" rx="10" fill="#FFF7ED" stroke="#FED7AA"/><text x="676" y="440" class="small">模型调度器</text>
  <rect x="820" y="418" width="150" height="34" rx="10" fill="#FDF2F8" stroke="#FBCFE8"/><text x="846" y="440" class="small">Word 导出</text>

  <line x1="385" y1="480" x2="385" y2="522" class="arrow"/>
  <line x1="725" y1="480" x2="725" y2="522" class="arrow"/>

  <rect x="70" y="530" width="475" height="95" rx="22" class="box"/>
  <text x="100" y="565" class="layer-title">数据层</text>
  <text x="100" y="592" class="subtitle">SQLite / 可扩展 PostgreSQL</text>
  <text x="100" y="614" class="small">cases · materials · workflow_nodes · templates · channels · prompts</text>

  <rect x="575" y="530" width="475" height="95" rx="22" class="box"/>
  <text x="605" y="565" class="layer-title">外部能力</text>
  <text x="605" y="592" class="subtitle">OpenAI-compatible LLM API</text>
  <text x="605" y="614" class="small">生成、流式输出、多模型渠道、自定义 Base URL</text>

  <path d="M290 284 C230 268 202 252 172 226" stroke="url(#primary)" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M830 284 C884 266 894 248 832 226" stroke="url(#primary)" stroke-width="2" stroke-dasharray="6 8"/>
</svg>
